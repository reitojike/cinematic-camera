name: P0 APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '新規pre-release tag (v0.0.1-dev.1 など)'
        required: true
        type: string
      commit:
        description: '配布するmain commitの40桁SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p0-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: main commitと新規tagを確認
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|dev)\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo '指定tagは既に存在します' >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_COMMIT"
          echo "CINEMATIC_RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: P0のlint・unit・APK build
        env:
          CINEMATIC_VERSION_NAME: ${{ inputs.tag }}
          CINEMATIC_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: 署名・識別子を確認して配布物を準備
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-release"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/p0-release/SIGNING.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E "^package: name='dev\.cinematic\.p0' versionCode='${RELEASE_VERSION_CODE}'"
          cp "$apk" "$RUNNER_TEMP/p0-release/cinematic-camera-p0.apk"
          cd "$RUNNER_TEMP/p0-release"
          sha256sum cinematic-camera-p0.apk > SHA256SUMS.txt
          {
            printf '# Cinematic Camera P0\n\n'
            printf -- '- source main: `%s`\n' "$CINEMATIC_RELEASE_COMMIT"
            printf -- '- versionName: `%s`, versionCode: `%s`\n' "$RELEASE_TAG" "$RELEASE_VERSION_CODE"
            printf -- '- applicationId: `dev.cinematic.p0`; minSdk 28 / targetSdk 37\n'
            printf -- '- 一時debug署名。継続更新用の固定署名鍵は未導入。\n'
            printf -- '- Pixel 9a実機ACは未検証。P1は未判定。\n'
            printf -- '- APK SHA-256: `%s`\n' "$(cut -d ' ' -f1 SHA256SUMS.txt)"
            printf -- '- workflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > RELEASE_NOTES.md
          cat SIGNING.txt >> RELEASE_NOTES.md
      - name: P0 pre-releaseへ保存
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/p0-release/cinematic-camera-p0.apk" \
            "$RUNNER_TEMP/p0-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/p0-release/SIGNING.txt" \
            --target "$CINEMATIC_RELEASE_COMMIT" --prerelease --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/p0-release/RELEASE_NOTES.md"
