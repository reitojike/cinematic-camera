name: ATD non-GPU experiment

# Deliberately independent of Android checks and its required aggregate.
on:
  pull_request:
    paths:
      - '.github/workflows/atd-experiment.yml'
      - 'tools/atd-ci/**'
      - 'docs/ATD_CI_FEASIBILITY.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atd-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selected-atd:
    name: ATD experiment (not GPU evidence)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install pinned PNG decoder
        run: python3 -m pip install Pillow==12.0.0
      - name: Validate verification harness
        run: python3 -B -m unittest discover -s tools/atd-ci -v
      - name: Install emulator runtime library
        run: sudo apt-get update && sudo apt-get install -y libpulse0 acl
      - name: SDK and ATD package inventory
        run: |
          mkdir -p atd-evidence
          sdkmanager --list > atd-evidence/sdk-packages.txt
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 'emulator' 'system-images;android-37.0;google_atd;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version > atd-evidence/emulator.txt 2>&1
          cat "$ANDROID_HOME/system-images/android-37.0/google_atd/x86_64/source.properties" > atd-evidence/image.txt
      # Owner approved KVM access on disposable GitHub runners only.
      # Do not make /dev/kvm world-writable or alter persistent groups/udev rules.
      - name: Allow only this hosted runner user to use KVM
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          getfacl /dev/kvm > atd-evidence/kvm-acl.txt
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee atd-evidence/acceleration.txt
      - name: Build before emulator boot
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Start one ATD without snapshot on the disposable runner
        run: |
          df -h > atd-evidence/disk-before-boot.txt
          echo no | avdmanager create avd --name ci_atd --package 'system-images;android-37.0;google_atd;x86_64'
          cat >> "$HOME/.android/avd/ci_atd.avd/config.ini" <<'EOF'
          hw.ramSize=2048
          hw.cpu.ncore=2
          disk.dataPartition.size=2G
          hw.lcd.width=1080
          hw.lcd.height=2424
          hw.lcd.density=420
          EOF
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee atd-evidence/acceleration-before-boot.txt
          "$ANDROID_HOME/emulator/emulator" -avd ci_atd -port 5554 -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on > atd-evidence/emulator-boot.txt 2>&1 &
          echo $! > atd-evidence/emulator.pid
          timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb -s emulator-5554 shell getprop ro.build.fingerprint > atd-evidence/fingerprint.txt
      - name: Run explicitly selected methods on the selected ATD
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          selection=$(python3 tools/atd-ci/verify.py --selection)
          ./gradlew :app:connectedDebugAndroidTest --rerun --no-daemon --max-workers=1 --console=plain \
            -Pandroid.testInstrumentationRunnerArguments.class="$selection" \
            -Pandroid.testInstrumentationRunnerArguments.isolated=true \
            -Pandroid.testInstrumentationRunnerArguments.dngImportStorage=true \
            -Pandroid.testInstrumentationRunnerArguments.dngImportReselection=true \
            > atd-evidence/gradle.txt 2>&1
      - name: Record emulator diagnostics and stop only the CI ATD
        if: always()
        run: |
          mkdir -p atd-evidence
          df -h > atd-evidence/disk-after.txt
          getfacl /dev/kvm > atd-evidence/kvm-acl-after.txt || true
          adb -s emulator-5554 emu kill || true
      - name: Record installed image revisions
        if: always()
        run: |
          mkdir -p atd-evidence
          find "$ANDROID_HOME/system-images" -name source.properties -exec cat {} \; > atd-evidence/images.txt 2>/dev/null || true
      - name: Require exact methods, zero skips and all software Canvas images
        shell: bash
        if: ${{ !cancelled() }}
        run: python3 tools/atd-ci/verify.py app/build | tee atd-evidence/verification.txt
      - name: Keep evidence (software Canvas is not screen/GPU output)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atd-experiment-${{ github.run_attempt }}
          path: |
            atd-evidence/verification.txt
            app/build/outputs/connected_android_test_additional_output/**/*.png
          if-no-files-found: error
          retention-days: 7
