name: Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All variants use the same run identity; each job has an isolated build directory.
env:
  CINEMATIC_VERSION_NAME: 0.0.10-p05.ci.${{ github.run_number }}
  CINEMATIC_VERSION_CODE: ${{ github.run_number }}

jobs:
  product:
    name: 製品 lint・unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Release notes and version history tests (no signing or publication)
        run: python3 -B -m unittest discover -s tools/release -v
      - name: GPU golden tooling unit tests (no emulator)
        run: python3 -B -m unittest discover -s tools/gpu-golden -v
      - name: GPU instance evidence unit tests (no emulator)
        shell: pwsh
        run: ./tools/gpu-golden/test_instance_evidence.ps1
      - name: Preview timing summary unit tests
        run: python3 -B -m unittest discover -s tools/preview-timing -v
      - name: lint・unit・debug build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:processReleaseMainManifest --no-daemon
      - name: Retired diagnostic entry points stay absent
        run: |
          python3 -B -m unittest discover -s tools/diagnostic-retirement -v
          python3 -B tools/diagnostic-retirement/verify_retired.py . app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
      - name: Verify LWJGL is absent from normal APK and unit-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/reports/gpuMesaIsolation
          for configuration in debugRuntimeClasspath debugUnitTestRuntimeClasspath; do
            ./gradlew :app:dependencies --configuration "$configuration" --console=plain --no-daemon > "app/build/reports/gpuMesaIsolation/$configuration.txt"
            if grep -F 'org.lwjgl:' "app/build/reports/gpuMesaIsolation/$configuration.txt"; then
              echo "LWJGL leaked into normal $configuration" >&2
              exit 1
            fi
          done
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" > app/build/reports/gpuMesaIsolation/apk-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$apk" > app/build/reports/gpuMesaIsolation/apk-dex-packages.txt
          if grep -i lwjgl app/build/reports/gpuMesaIsolation/apk-files.txt || grep -F 'org.lwjgl' app/build/reports/gpuMesaIsolation/apk-dex-packages.txt; then
            echo 'LWJGL native or classes leaked into normal APK' >&2
            exit 1
          fi
          echo 'GPU_MESA_ISOLATION PASS: no LWJGL in normal debug runtime, unit-test runtime, APK natives or DEX packages'
      - name: DNG test runner登録を確認
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk AndroidManifest.xml > "$RUNNER_TEMP/cinematic-test-manifest.txt"
          grep -F '"androidx.test.runner.AndroidJUnitRunner"' "$RUNNER_TEMP/cinematic-test-manifest.txt"
          grep -F '"dev.cinematic.p0.rawcapture.DngHandoffInstrumentation"' "$RUNNER_TEMP/cinematic-test-manifest.txt"
      - name: APKの署名・識別子・ハッシュを記録
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E "^package: name='dev\.cinematic\.p0' versionCode='${CINEMATIC_VERSION_CODE}'"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: 一時署名のP0 APKを保存
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-camera-p0-debug-apk-ephemeral
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: テスト・lintレポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-camera-p0-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/gpuMesaIsolation/
          if-no-files-found: warn
          retention-days: 7

  rawprobe:
    name: rawprobe unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: rawprobe unit・build
        run: ./gradlew :rawprobe:testNormalDebugUnitTest :rawprobe:assembleNormalDebug :rawprobe:assembleNormalDebugAndroidTest :rawprobe:testLargeHeapDebugUnitTest :rawprobe:assembleLargeHeapDebug :rawprobe:assembleLargeHeapDebugAndroidTest --no-daemon
      - name: Prepare RAW probe APKs and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rawprobe/build/diagnostic
          cp rawprobe/build/outputs/apk/normal/debug/rawprobe-normal-debug.apk rawprobe/build/diagnostic/rawprobe-debug.apk
          cp rawprobe/build/outputs/apk/androidTest/normal/debug/rawprobe-normal-debug-androidTest.apk rawprobe/build/diagnostic/rawprobe-debug-androidTest.apk
          cp rawprobe/build/outputs/apk/largeHeap/debug/rawprobe-largeHeap-debug.apk rawprobe/build/diagnostic/rawprobe-largeheap.apk
          cp rawprobe/build/outputs/apk/androidTest/largeHeap/debug/rawprobe-largeHeap-debug-androidTest.apk rawprobe/build/diagnostic/rawprobe-largeheap-androidTest.apk
          cp docs/RAW_PROBE.md docs/BASELINE_JPEG_PROBE.md tools/raw-probe/*.ps1 tools/raw-probe/Measure-BaselineJpeg.py rawprobe/build/diagnostic/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('tools/raw-probe/Measure-BaselineJpeg.py').read_text(encoding='utf-8'))
          PY
          (cd rawprobe/build/diagnostic && sha256sum *.apk > SHA256SUMS.txt)
      - name: Isolated RAW diagnostic APKs
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-raw-probe-debug
          path: rawprobe/build/diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: rawprobe unit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-raw-probe-check-reports
          path: |
            rawprobe/build/reports/tests/
            rawprobe/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  jni-isolation:
    name: app・rawprobe JNI isolation
    needs: [product, rawprobe]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Pinned APK and native inspection tools
        run: sdkmanager "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Download the product APK from this run
        uses: actions/download-artifact@v8
        with:
          name: cinematic-camera-p0-debug-apk-ephemeral
          path: app/build/outputs/apk/debug/
      - name: Download rawprobe APKs from this run
        uses: actions/download-artifact@v8
        with:
          name: cinematic-raw-probe-debug
          path: rawprobe/build/diagnostic/
      - name: Verify downloaded APK checksums
        run: |
          sha256sum -c app/build/outputs/apk/debug/SHA256SUMS.txt
          (cd rawprobe/build/diagnostic && sha256sum -c SHA256SUMS.txt)
      - name: Verify app / rawprobe JNI and manifest isolation
        shell: bash
        run: |
          set -euo pipefail
          readelf="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            unzip -p app/build/outputs/apk/debug/app-debug.apk "lib/$abi/libcinematic_dng.so" > "$RUNNER_TEMP/normal-$abi.so"
            unzip -p rawprobe/build/diagnostic/rawprobe-debug.apk "lib/$abi/libcinematic_dng.so" > "$RUNNER_TEMP/probe-$abi.so"
            "$readelf" --dyn-syms --wide "$RUNNER_TEMP/normal-$abi.so" > "$RUNNER_TEMP/normal-$abi.symbols"
            "$readelf" --dyn-syms --wide "$RUNNER_TEMP/probe-$abi.so" > "$RUNNER_TEMP/probe-$abi.symbols"
            grep -F 'Java_dev_cinematic_p0_raw_NativeDngDecoder_decode' "$RUNNER_TEMP/normal-$abi.symbols"
            if grep -F 'Java_dev_cinematic_rawprobe_' "$RUNNER_TEMP/normal-$abi.symbols"; then
              echo 'Diagnostic JNI leaked into the camera app' >&2
              exit 1
            fi
            grep -F 'Java_dev_cinematic_rawprobe_NativeFullResolutionProbe_inspect' "$RUNNER_TEMP/probe-$abi.symbols"
            grep -E 'Java_dev_cinematic_rawprobe_NativeBaselineProbe_decode$' "$RUNNER_TEMP/probe-$abi.symbols"
            grep -E 'Java_dev_cinematic_rawprobe_NativeBaselineProbe_decodeLarge$' "$RUNNER_TEMP/probe-$abi.symbols"
            if grep -F 'Java_dev_cinematic_p0_raw_' "$RUNNER_TEMP/probe-$abi.symbols"; then
              echo 'Camera JNI leaked into the diagnostic app' >&2
              exit 1
            fi
          done
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump xmltree rawprobe/build/diagnostic/rawprobe-debug.apk AndroidManifest.xml > "$RUNNER_TEMP/rawprobe-normal.xml"
          "$aapt" dump xmltree rawprobe/build/diagnostic/rawprobe-largeheap.apk AndroidManifest.xml > "$RUNNER_TEMP/rawprobe-large.xml"
          grep -F 'package="dev.cinematic.rawprobe"' "$RUNNER_TEMP/rawprobe-normal.xml"
          grep -E 'android:largeHeap.*\(type 0x12\)0x0$' "$RUNNER_TEMP/rawprobe-normal.xml"
          grep -F 'package="dev.cinematic.rawprobe.largeheap"' "$RUNNER_TEMP/rawprobe-large.xml"
          grep -E 'android:largeHeap.*\(type 0x12\)0xffffffff$' "$RUNNER_TEMP/rawprobe-large.xml"

  mesa:
    name: Mesa shader・pixel regression
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Download Mesa packages from the pinned storage release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          manifest="tools/gpu-mesa/mesa-debs-manifest.txt"
          tag="$(awk -F': ' '$1 == "release-tag" { print $2 }' "$manifest")"
          test -n "$tag"
          echo "Mesa .deb storage release tag: $tag"
          cache="$RUNNER_TEMP/mesa-debs"
          mkdir -p "$cache"
          # The tag is fixed by the manifest. The release is immutable, so its assets
          # cannot be added, changed, or deleted after publication.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$cache"
          ls -l "$cache"
      - name: Verify Mesa packages against the manifest and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          manifest="tools/gpu-mesa/mesa-debs-manifest.txt"
          cache="$RUNNER_TEMP/mesa-debs"
          # The downloaded SHA256SUMS must itself match the digest recorded in the manifest.
          expected_sums_sha="$(awk -F': ' '$1 == "sha256sums-sha256" { print $2 }' "$manifest")"
          actual_sums_sha="$(sha256sum "$cache/SHA256SUMS" | awk '{ print $1 }')"
          [[ "$actual_sums_sha" == "$expected_sums_sha" ]]
          # Manifest data rows (filename | package | version | arch | sha256 | class) as TSV.
          awk -F' \\| ' '!/^#/ && NF == 6 { print $1"\t"$2"\t"$3"\t"$4"\t"$5"\t"$6 }' "$manifest" > "$RUNNER_TEMP/mesa-manifest.tsv"
          [[ "$(wc -l < "$RUNNER_TEMP/mesa-manifest.tsv")" -eq 69 ]]
          # Three-way set equality: manifest rows, SHA256SUMS entries, downloaded .deb files.
          cut -f1 "$RUNNER_TEMP/mesa-manifest.tsv" | sort > "$RUNNER_TEMP/mesa-expected-files.txt"
          awk '{ print $2 }' "$cache/SHA256SUMS" | sort | diff -u "$RUNNER_TEMP/mesa-expected-files.txt" -
          (cd "$cache" && ls -- *.deb | sort) | diff -u "$RUNNER_TEMP/mesa-expected-files.txt" -
          # Every downloaded .deb must match the release's SHA256SUMS (missing or damaged files fail).
          (cd "$cache" && sha256sum -c SHA256SUMS)
          # Each file must also match the manifest's own SHA256 and its
          # Package / Version (with epoch) / Architecture fields.
          architecture="$(dpkg --print-architecture)"
          packages="$RUNNER_TEMP/mesa-package-names.txt"
          : > "$packages"
          while IFS=$'\t' read -r file package version arch sha class; do
            deb="$cache/$file"
            test -f "$deb" && test ! -L "$deb"
            [[ "$(sha256sum "$deb" | awk '{ print $1 }')" == "$sha" ]]
            [[ "$(dpkg-deb -f "$deb" Package)" == "$package" ]]
            [[ "$(dpkg-deb -f "$deb" Version)" == "$version" ]]
            deb_arch="$(dpkg-deb -f "$deb" Architecture)"
            [[ "$deb_arch" == "$arch" && ( "$deb_arch" == "$architecture" || "$deb_arch" == all ) ]]
            echo "$package" >> "$packages"
          done < "$RUNNER_TEMP/mesa-manifest.tsv"
      - name: Install Mesa packages and record the result
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          cache="$RUNNER_TEMP/mesa-debs"
          packages="$RUNNER_TEMP/mesa-package-names.txt"
          record="$GITHUB_WORKSPACE/mesa-install-record"
          mkdir -p "$record"
          for package in libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri; do
            grep -Fx "$package" "$packages"
          done
          # Decide per package, by the class recorded in the manifest.
          # Class A (rendering-determining): always install the stored .deb.
          # Class B (OS foundation): if the runner already has the same or a newer
          # version, keep the runner's version and do not install the stored .deb.
          # Install the stored .deb only when the package is missing or older.
          # A package is never downgraded. The decision is recorded per package.
          : > "$record/dpkg-before.txt"
          install_files=()
          while IFS=$'\t' read -r file package version arch sha class; do
            installed="$(dpkg-query -W -f='${Version}' "$package" 2>/dev/null || true)"
            [[ -n "$installed" ]] || installed="not-installed"
            if [[ "$class" == "B" && "$installed" != "not-installed" ]] \
              && dpkg --compare-versions "$installed" ge "$version"; then
              decision="use-runner"
            else
              decision="install-stored"
              install_files+=("$cache/$file")
            fi
            echo "$package class=$class manifest=$version before=$installed decision=$decision" >> "$record/dpkg-before.txt"
            echo "$decision" > "$RUNNER_TEMP/mesa-decision-$package.txt"
          done < "$RUNNER_TEMP/mesa-manifest.tsv"
          # Exact-version groups: some packages are tied together by (=) version
          # requirements in their .deb control data (for example libc6 with
          # libc-gconv-modules-extra, libgcc-s1 / libstdc++6 with gcc-16-base, the
          # libglvnd family, and the libx11 / libxcb -dev pairs). If the decisions
          # split inside such a group (some members install the stored .deb while
          # others keep the runner's version), the installed versions would diverge
          # and break the (=) ties. Derive the groups mechanically from the
          # downloaded .deb files and stop here, before installing anything, if a
          # group is split. Groups are never merged into a single install decision:
          # a foundation library is never pulled back to an older version just to
          # match the rest of its group.
          python3 - "$cache" "$RUNNER_TEMP" <<'PYEOF' | tee "$record/dpkg-groups.txt"
          import re, subprocess, sys
          from collections import defaultdict
          cache, temp = sys.argv[1], sys.argv[2]
          rows = []
          with open(f"{temp}/mesa-manifest.tsv") as fh:
              for line in fh:
                  rows.append(line.rstrip("\n").split("\t"))
          known = {r[1] for r in rows}
          parent = {p: p for p in known}
          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x
          edges = []
          for file, package, *_ in rows:
              out = subprocess.run(["dpkg-deb", "-f", f"{cache}/{file}", "Depends", "Pre-Depends"],
                                   capture_output=True, text=True).stdout
              deps = " ".join(l.split(":", 1)[1] for l in out.splitlines() if ":" in l)
              for group in deps.split(","):
                  for alt in group.split("|"):
                      m = re.match(r"\s*([A-Za-z0-9.+-]+)\s*\(([^)]*)\)", alt)
                      if m and m.group(1) in known and m.group(2).strip().startswith("="):
                          edges.append((package, m.group(1)))
                          ra, rb = find(package), find(m.group(1))
                          if ra != rb:
                              parent[ra] = rb
          members = defaultdict(set)
          for a, b in edges:
              members[find(a)].update((a, b))
          decisions = {}
          for _, package, *_ in rows:
              with open(f"{temp}/mesa-decision-{package}.txt") as fh:
                  decisions[package] = fh.read().strip()
          split = False
          for root in sorted(members, key=lambda r: sorted(members[r])):
              mem = sorted(members[root])
              print("group: " + ", ".join(f"{p}={decisions[p]}" for p in mem))
              if len({decisions[p] for p in mem}) > 1:
                  split = True
                  print("ERROR: decisions split inside an exact-version group: " + ", ".join(mem))
          if split:
              sys.exit("exact-version group decision check failed; not installing anything")
          print("exact-version groups: all decisions uniform")
          PYEOF
          # Incomplete dependency closure fails here instead of fetching or skipping Mesa.
          if [[ "${#install_files[@]}" -gt 0 ]]; then
            sudo dpkg --install "${install_files[@]}" 2>&1 | tee "$record/dpkg-install.log"
          else
            echo "no packages selected for installation" | tee "$record/dpkg-install.log"
          fi
          sudo apt-get --no-download check 2>&1 | tee "$record/apt-check.log"
          # After installation: class A must be exactly the manifest version and fully
          # installed. Class B must be fully installed at the manifest version or newer
          # (the runner's version, when it was kept). Anything else fails the job.
          : > "$record/dpkg-after.txt"
          while IFS=$'\t' read -r file package version arch sha class; do
            state="$(dpkg-query -W -f='${Version} ${Status}' "$package")"
            decision="$(cat "$RUNNER_TEMP/mesa-decision-$package.txt")"
            source="runner"
            [[ "$decision" == "install-stored" ]] && source="stored"
            echo "$package class=$class source=$source $state" >> "$record/dpkg-after.txt"
            after_version="${state%% *}"
            [[ "$state" == "$after_version install ok installed" ]]
            if [[ "$class" == "A" ]]; then
              [[ "$after_version" == "$version" ]]
            else
              dpkg --compare-versions "$after_version" ge "$version"
            fi
          done < "$RUNNER_TEMP/mesa-manifest.tsv"
          dpkg-query -W libegl-mesa0 libgl1-mesa-dri libgles2 | tee "$record/dpkg-key-packages.txt"
      - name: Mesa GLES 3.2 shader / pixel regression (not Android acceptance)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LP_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          ./gradlew :app:testDebugUnitTest -PcinematicGpuMesa=true --tests 'dev.cinematic.p0.gpu.mesa.*' --no-daemon --max-workers=2
          echo "GPU_MESA_GRADLE_SECONDS=$((SECONDS - started))"
      - name: Mesa report contract unit tests
        run: python3 -B -m unittest discover -s tools/gpu-diagnostic -v
      - name: Mesa required cases (missing, zero, failure, or skip is a failure)
        if: ${{ !cancelled() }}
        run: python3 -B tools/gpu-diagnostic/check_mesa_reports.py app/build/test-results/gpuMesa/testDebugUnitTest
      - name: Mesa shader regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-gpu-mesa-reports
          path: |
            app/build/test-results/gpuMesa/
            app/build/reports/tests/gpuMesa/
            mesa-install-record/
          if-no-files-found: warn
          retention-days: 7

  android:
    # Keep the existing branch-protection check name, including its punctuation.
    name: lint・unit・build
    needs: [product, rawprobe, jni-isolation, mesa]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation job to succeed
        env:
          PRODUCT_RESULT: ${{ needs.product.result }}
          RAWPROBE_RESULT: ${{ needs.rawprobe.result }}
          JNI_RESULT: ${{ needs.jni-isolation.result }}
          MESA_RESULT: ${{ needs.mesa.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'product=%s rawprobe=%s jni-isolation=%s mesa=%s\n' \
            "$PRODUCT_RESULT" "$RAWPROBE_RESULT" "$JNI_RESULT" "$MESA_RESULT"
          for result in "$PRODUCT_RESULT" "$RAWPROBE_RESULT" "$JNI_RESULT" "$MESA_RESULT"; do
            if [[ "$result" != success ]]; then
              echo 'A required validation job failed, was cancelled, or was skipped.' >&2
              exit 1
            fi
          done
