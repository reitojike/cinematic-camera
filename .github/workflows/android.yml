name: Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All variants use the same run identity; each job has an isolated build directory.
env:
  CINEMATIC_VERSION_NAME: 0.0.10-p05.ci.${{ github.run_number }}
  CINEMATIC_VERSION_CODE: ${{ github.run_number }}

jobs:
  product:
    name: 製品 lint・unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Preview timing summary unit tests
        run: python3 -B -m unittest discover -s tools/preview-timing -v
      - name: lint・unit・debug build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify LWJGL is absent from normal APK and unit-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/reports/gpuMesaIsolation
          for configuration in debugRuntimeClasspath debugUnitTestRuntimeClasspath; do
            ./gradlew :app:dependencies --configuration "$configuration" --console=plain --no-daemon > "app/build/reports/gpuMesaIsolation/$configuration.txt"
            if grep -F 'org.lwjgl:' "app/build/reports/gpuMesaIsolation/$configuration.txt"; then
              echo "LWJGL leaked into normal $configuration" >&2
              exit 1
            fi
          done
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" > app/build/reports/gpuMesaIsolation/apk-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$apk" > app/build/reports/gpuMesaIsolation/apk-dex-packages.txt
          if grep -i lwjgl app/build/reports/gpuMesaIsolation/apk-files.txt || grep -F 'org.lwjgl' app/build/reports/gpuMesaIsolation/apk-dex-packages.txt; then
            echo 'LWJGL native or classes leaked into normal APK' >&2
            exit 1
          fi
          echo 'GPU_MESA_ISOLATION PASS: no LWJGL in normal debug runtime, unit-test runtime, APK natives or DEX packages'
      - name: DNG test runner登録を確認
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk AndroidManifest.xml > "$RUNNER_TEMP/cinematic-test-manifest.txt"
          grep -F '"androidx.test.runner.AndroidJUnitRunner"' "$RUNNER_TEMP/cinematic-test-manifest.txt"
          grep -F '"dev.cinematic.p0.rawcapture.DngHandoffInstrumentation"' "$RUNNER_TEMP/cinematic-test-manifest.txt"
      - name: APKの署名・識別子・ハッシュを記録
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E "^package: name='dev\.cinematic\.p0' versionCode='${CINEMATIC_VERSION_CODE}'"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: 一時署名のP0 APKを保存
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-camera-p0-debug-apk-ephemeral
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: テスト・lintレポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-camera-p0-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/gpuMesaIsolation/
          if-no-files-found: warn
          retention-days: 7

  gpu-diagnostic:
    name: GPU 診断 unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: GPU合成診断をコンパイル（GPU試験は実行しない）
        run: ./gradlew :app:testGpuDiagnosticUnitTest :app:assembleGpuDiagnostic :app:assembleGpuDiagnosticAndroidTest :app:processDebugMainManifest :app:processReleaseMainManifest -PcinematicGpuDiagnostic=true -PcinematicGpuDiagnosticTests=true --no-daemon
      - name: GPU診断のmanifest隔離を検証
        run: python3 -B tools/gpu-diagnostic/verify_manifest.py app/build/intermediates/merged_manifest/gpuDiagnostic/processGpuDiagnosticMainManifest/AndroidManifest.xml app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
      - name: GPU診断のunitレポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-gpu-diagnostic-check-reports
          path: |
            app/build/reports/tests/testGpuDiagnosticUnitTest/
            app/build/test-results/testGpuDiagnosticUnitTest/
          if-no-files-found: warn
          retention-days: 7

  raw-diagnostic:
    name: RAW 診断 unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: RAW4 diagnostic judgement unit tests
        run: python3 -B -m unittest discover -s tools/raw-diagnostic -v
      - name: RAW diagnostic unit・build and release manifest
        run: ./gradlew :app:testRawDiagnosticUnitTest :app:assembleRawDiagnostic :app:processDebugMainManifest :app:processReleaseMainManifest -PcinematicRawDiagnostic=true -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --no-daemon
      - name: Compile synthetic RAW diagnostic instrumentation
        run: ./gradlew :app:assembleRawDiagnosticAndroidTest -PcinematicRawDiagnostic=true -PcinematicRawDiagnosticTests=true --no-daemon
      - name: Verify RAW diagnostic optimization recipe
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/rawDiagnostic/app-rawDiagnostic.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/raw-diagnostic-manifest.xml"
          python3 - <<'PY'
          import json
          import os
          import shlex
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android = '{http://schemas.android.com/apk/res/android}'
          manifest = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'raw-diagnostic-manifest.xml').getroot()
          app = manifest.find('application')
          assert manifest.attrib['package'] == 'dev.cinematic.p0.rawdiagnostic'
          assert app.attrib.get(android + 'debuggable', 'false') == 'false'
          assert app.attrib.get(android + 'largeHeap', 'false') == 'false'
          assert app.find('profileable').attrib[android + 'shell'] == 'true'
          assert not manifest.findall('uses-permission'), 'diagnostic must request no permissions'
          activities = app.findall('activity')
          assert len(activities) == 1 and activities[0].attrib[android + 'name'] == 'dev.cinematic.p0.rawdiagnostic.RawDiagnosticActivity'
          assert not any(app.findall(tag) for tag in ('service', 'provider', 'receiver', 'activity-alias'))
          for variant in ('debug', 'release'):
              path = Path(f'app/build/intermediates/merged_manifest/{variant}/process{variant.title()}MainManifest/AndroidManifest.xml')
              normal = ET.parse(path).getroot().find('application')
              assert normal.find('profileable') is None, f'profileable leaked into {variant}'

          abis = set()
          for path in Path('app/.cxx/RelWithDebInfo').glob('*/*/compile_commands.json'):
              abi = path.parent.name
              if abi not in ('arm64-v8a', 'x86_64'):
                  continue
              commands = json.loads(path.read_text())
              assert any(Path(entry['file']).name == 'dng_decoder.cpp' for entry in commands)
              assert any('libraw-src' in entry['file'] for entry in commands)
              for entry in commands:
                  flags = entry.get('arguments') or shlex.split(entry['command'])
                  assert [flag for flag in flags if flag.startswith('-O')] == ['-O2'], entry['file']
                  assert '-DNDEBUG' in flags, entry['file']
              abis.add(abi)
          assert abis == {'arm64-v8a', 'x86_64'}, abis
          print('RAW diagnostic manifest and native O2/NDEBUG verified; normal manifests are not profileable.')
          PY
      - name: RAW診断のunitレポートを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-raw-diagnostic-check-reports
          path: |
            app/build/reports/tests/testRawDiagnosticUnitTest/
            app/build/test-results/testRawDiagnosticUnitTest/
          if-no-files-found: warn
          retention-days: 7

  rawprobe:
    name: rawprobe unit・build
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: rawprobe unit・build
        run: ./gradlew :rawprobe:testNormalDebugUnitTest :rawprobe:assembleNormalDebug :rawprobe:assembleNormalDebugAndroidTest :rawprobe:testLargeHeapDebugUnitTest :rawprobe:assembleLargeHeapDebug :rawprobe:assembleLargeHeapDebugAndroidTest --no-daemon
      - name: Prepare RAW probe APKs and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rawprobe/build/diagnostic
          cp rawprobe/build/outputs/apk/normal/debug/rawprobe-normal-debug.apk rawprobe/build/diagnostic/rawprobe-debug.apk
          cp rawprobe/build/outputs/apk/androidTest/normal/debug/rawprobe-normal-debug-androidTest.apk rawprobe/build/diagnostic/rawprobe-debug-androidTest.apk
          cp rawprobe/build/outputs/apk/largeHeap/debug/rawprobe-largeHeap-debug.apk rawprobe/build/diagnostic/rawprobe-largeheap.apk
          cp rawprobe/build/outputs/apk/androidTest/largeHeap/debug/rawprobe-largeHeap-debug-androidTest.apk rawprobe/build/diagnostic/rawprobe-largeheap-androidTest.apk
          cp docs/RAW_PROBE.md docs/BASELINE_JPEG_PROBE.md tools/raw-probe/*.ps1 tools/raw-probe/Measure-BaselineJpeg.py rawprobe/build/diagnostic/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('tools/raw-probe/Measure-BaselineJpeg.py').read_text(encoding='utf-8'))
          PY
          (cd rawprobe/build/diagnostic && sha256sum *.apk > SHA256SUMS.txt)
      - name: Isolated RAW diagnostic APKs
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-raw-probe-debug
          path: rawprobe/build/diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: rawprobe unit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-raw-probe-check-reports
          path: |
            rawprobe/build/reports/tests/
            rawprobe/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  jni-isolation:
    name: app・rawprobe JNI isolation
    needs: [product, rawprobe]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Pinned APK and native inspection tools
        run: sdkmanager "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Download the product APK from this run
        uses: actions/download-artifact@v8
        with:
          name: cinematic-camera-p0-debug-apk-ephemeral
          path: app/build/outputs/apk/debug/
      - name: Download rawprobe APKs from this run
        uses: actions/download-artifact@v8
        with:
          name: cinematic-raw-probe-debug
          path: rawprobe/build/diagnostic/
      - name: Verify downloaded APK checksums
        run: |
          sha256sum -c app/build/outputs/apk/debug/SHA256SUMS.txt
          (cd rawprobe/build/diagnostic && sha256sum -c SHA256SUMS.txt)
      - name: Verify app / rawprobe JNI and manifest isolation
        shell: bash
        run: |
          set -euo pipefail
          readelf="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            unzip -p app/build/outputs/apk/debug/app-debug.apk "lib/$abi/libcinematic_dng.so" > "$RUNNER_TEMP/normal-$abi.so"
            unzip -p rawprobe/build/diagnostic/rawprobe-debug.apk "lib/$abi/libcinematic_dng.so" > "$RUNNER_TEMP/probe-$abi.so"
            "$readelf" --dyn-syms --wide "$RUNNER_TEMP/normal-$abi.so" > "$RUNNER_TEMP/normal-$abi.symbols"
            "$readelf" --dyn-syms --wide "$RUNNER_TEMP/probe-$abi.so" > "$RUNNER_TEMP/probe-$abi.symbols"
            grep -F 'Java_dev_cinematic_p0_raw_NativeDngDecoder_decode' "$RUNNER_TEMP/normal-$abi.symbols"
            if grep -F 'Java_dev_cinematic_rawprobe_' "$RUNNER_TEMP/normal-$abi.symbols"; then
              echo 'Diagnostic JNI leaked into the camera app' >&2
              exit 1
            fi
            grep -F 'Java_dev_cinematic_rawprobe_NativeFullResolutionProbe_inspect' "$RUNNER_TEMP/probe-$abi.symbols"
            grep -E 'Java_dev_cinematic_rawprobe_NativeBaselineProbe_decode$' "$RUNNER_TEMP/probe-$abi.symbols"
            grep -E 'Java_dev_cinematic_rawprobe_NativeBaselineProbe_decodeLarge$' "$RUNNER_TEMP/probe-$abi.symbols"
            if grep -F 'Java_dev_cinematic_p0_raw_' "$RUNNER_TEMP/probe-$abi.symbols"; then
              echo 'Camera JNI leaked into the diagnostic app' >&2
              exit 1
            fi
          done
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump xmltree rawprobe/build/diagnostic/rawprobe-debug.apk AndroidManifest.xml > "$RUNNER_TEMP/rawprobe-normal.xml"
          "$aapt" dump xmltree rawprobe/build/diagnostic/rawprobe-largeheap.apk AndroidManifest.xml > "$RUNNER_TEMP/rawprobe-large.xml"
          grep -F 'package="dev.cinematic.rawprobe"' "$RUNNER_TEMP/rawprobe-normal.xml"
          grep -E 'android:largeHeap.*\(type 0x12\)0x0$' "$RUNNER_TEMP/rawprobe-normal.xml"
          grep -F 'package="dev.cinematic.rawprobe.largeheap"' "$RUNNER_TEMP/rawprobe-large.xml"
          grep -E 'android:largeHeap.*\(type 0x12\)0xffffffff$' "$RUNNER_TEMP/rawprobe-large.xml"

  mesa:
    name: Mesa shader・pixel regression
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37 and pinned native tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Identify Mesa package cache platform
        id: mesa-platform
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "identity=$ID-$VERSION_ID-$(dpkg --print-architecture)-${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Mesa dependency packages
        id: mesa-debs
        uses: actions/cache@v6
        with:
          # No restore-keys: a different runner image or package recipe must not reuse .deb files.
          key: mesa-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mesa-platform.outputs.identity }}-${{ hashFiles('.github/workflows/android.yml') }}
          path: |
            ${{ runner.temp }}/mesa-debs/*.deb
            ${{ runner.temp }}/mesa-debs/SHA256SUMS
      - name: Download Mesa packages on cache miss
        if: steps.mesa-debs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          cache="$RUNNER_TEMP/mesa-debs"
          mkdir -p "$cache/partial"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          # --reinstall also downloads requested packages already present in the runner image.
          # Missing/upgraded dependencies are downloaded into the same cache by apt.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives="$cache" install --download-only --reinstall --no-install-recommends -y libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
          (cd "$cache" && sha256sum -- *.deb > SHA256SUMS)
      - name: Verify and install Mesa packages without network downloads
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          cache="$RUNNER_TEMP/mesa-debs"
          # This checks the complete file set too: missing, extra, or damaged .deb files fail.
          (cd "$cache" && sha256sum -- *.deb | diff -u SHA256SUMS -)
          architecture="$(dpkg --print-architecture)"
          packages="$RUNNER_TEMP/mesa-package-names.txt"
          : > "$packages"
          for deb in "$cache"/*.deb; do
            test -f "$deb" && test ! -L "$deb"
            deb_architecture="$(dpkg-deb -f "$deb" Architecture)"
            [[ "$deb_architecture" == "$architecture" || "$deb_architecture" == all ]]
            dpkg-deb -f "$deb" Package >> "$packages"
            dpkg-deb -f "$deb" Package Version Architecture
          done
          for package in libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri; do
            grep -Fx "$package" "$packages"
          done
          # Incomplete dependency closure fails here instead of fetching or skipping Mesa.
          sudo apt-get --no-download --no-install-recommends -y install "$cache"/*.deb
          dpkg-query -W libegl-mesa0 libgl1-mesa-dri libgles2
      - name: Mesa GLES 3.2 shader / pixel regression (not Android acceptance)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LP_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          ./gradlew :app:testDebugUnitTest -PcinematicGpuMesa=true --tests 'dev.cinematic.p0.gpu.mesa.*' --no-daemon --max-workers=2
          echo "GPU_MESA_GRADLE_SECONDS=$((SECONDS - started))"
      - name: Mesa test counts (zero tests or any skip is a failure)
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/gpuMesa/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Mesa tests did not produce JUnit reports'
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          seconds = 0.0
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              seconds += float(suite.get('time', '0'))
          print(f'GPU_MESA_JUNIT {totals} seconds={seconds:.3f}', flush=True)
          assert totals['tests'] > 0 and not any(totals[key] for key in ('failures', 'errors', 'skipped')), totals
          PY
      - name: Mesa shader regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-gpu-mesa-reports
          path: |
            app/build/test-results/gpuMesa/
            app/build/reports/tests/gpuMesa/
          if-no-files-found: warn
          retention-days: 7

  android:
    # Keep the existing branch-protection check name, including its punctuation.
    name: lint・unit・build
    needs: [product, gpu-diagnostic, raw-diagnostic, rawprobe, jni-isolation, mesa]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation job to succeed
        env:
          PRODUCT_RESULT: ${{ needs.product.result }}
          GPU_RESULT: ${{ needs.gpu-diagnostic.result }}
          RAW_RESULT: ${{ needs.raw-diagnostic.result }}
          RAWPROBE_RESULT: ${{ needs.rawprobe.result }}
          JNI_RESULT: ${{ needs.jni-isolation.result }}
          MESA_RESULT: ${{ needs.mesa.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'product=%s gpu-diagnostic=%s raw-diagnostic=%s rawprobe=%s jni-isolation=%s mesa=%s\n' \
            "$PRODUCT_RESULT" "$GPU_RESULT" "$RAW_RESULT" "$RAWPROBE_RESULT" "$JNI_RESULT" "$MESA_RESULT"
          for result in "$PRODUCT_RESULT" "$GPU_RESULT" "$RAW_RESULT" "$RAWPROBE_RESULT" "$JNI_RESULT" "$MESA_RESULT"; do
            if [[ "$result" != success ]]; then
              echo 'A required validation job failed, was cancelled, or was skipped.' >&2
              exit 1
            fi
          done
