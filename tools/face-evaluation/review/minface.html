<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>ACCURATE 最小顔サイズ比較</title><style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:12px;background:#191919;color:#eee}button,input,select{font:inherit;margin:6px;padding:8px}canvas{max-width:100%;height:auto;background:#000}fieldset{margin:12px 0}#status{white-space:pre-wrap;color:#ffd390}label{display:block}button{cursor:pointer}</style><h1>ACCURATE 最小顔サイズ比較</h1><p>推論を行う画面ではありません。端末内の評価結果と同一の RGBA を選び、枠を確認します。通信なし。画像・個別判定は書き出しません。</p><p>診断比較のみ。候補の検出増加を改善とは断定しません。前回の3方式の判定とは別保存です。候補 min0.05 だけの判定・保存・集計も可能です。基準 min0.1 を確認しない場合は未判定のまま残してください。旧判定は読み取りません。</p><label>2条件比較 JSON <input id="dataset" type="file" accept=".json"></label><label>同じ端末内の RGBA（複数選択可）<input id="pixels" type="file" accept=".rgba" multiple></label><p id="status">データを選択してください。</p><div><button id="prev">前へ</button><span id="position"></span><button id="next">次へ</button><select id="detector"><option value="accurate-min0.1">基準 ACCURATE / min0.1</option><option value="accurate-min0.05" selected>診断候補 ACCURATE / min0.05</option></select></div><canvas id="canvas"></canvas><fieldset><legend>この画像・方式の判定</legend><div id="boxes"></div><label>見逃した顔の数 <input id="missed" type="number" min="0" max="1000" value="0"></label><button id="save">判定を保存</button><button id="clear">この判定を未評価に戻す</button></fieldset><p>枠がすべて正しければ誤検出を選ばず、見逃しを 0 にして保存してください。顔なしの画像も同じ手順で明示的に確認します。</p><button id="export">集計だけを保存</button><script src="minface-core.js"></script><script src="minface-review.js"></script></html>
